name: Windows client setup

on:
  push:
    branches: [master, vnpy-opt-setup]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-client-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-client:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    name: Install and smoke test Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Run the first-time installer through cmd.exe
        shell: powershell
        run: |
          & .\setup_client.bat -PythonPath "$env:pythonLocation\python.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows client setup failed' }

      - name: Open and close the RPC client window without a server
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $smoke = @'
          import os
          import math
          import tempfile
          from pathlib import Path

          original_cwd = os.getcwd()
          with tempfile.TemporaryDirectory() as directory:
              os.chdir(directory)
              Path('.vntrader').mkdir()
              from vnpy.event import EventEngine
              from vnpy.trader.engine import MainEngine
              from vnpy.trader.ui import MainWindow, create_qapp, QtCore
              from vnpy.trader.logger import logger
              from vnpy_rpcservice import RpcGateway
              from vnpy_optionmaster import OptionMasterApp
              from vnpy_optionmaster.engine import PRICING_MODELS
              from vnpy_spreadtrading import SpreadTradingApp

              results = [model.calculate_greeks(100.0, 100.0, 0.02, 0.5, 0.25, 1) for model in PRICING_MODELS.values()]
              assert len(results) == 3
              assert all(len(values) == 5 and values[0] > 0 and all(math.isfinite(float(value)) for value in values) for values in results)

              app = create_qapp()
              engine = MainEngine(EventEngine())
              try:
                  engine.add_gateway(RpcGateway)
                  engine.add_app(OptionMasterApp)
                  engine.add_app(SpreadTradingApp)
                  app_names = {item.app_name for item in engine.get_all_apps()}
                  assert app_names == {"OptionMaster", "SpreadTrading"}, app_names
                  window = MainWindow(engine, engine.event_engine)
                  window.show()
                  assert window.isVisible()
                  QtCore.QTimer.singleShot(1000, app.exit)
                  app.exec()
                  print('PASS: Windows Trader window and RPC gateway initialized without credentials.')
              finally:
                  engine.close()
                  logger.remove()
                  os.chdir(original_cwd)
          '@
          & .\.venv\Scripts\python.exe -c $smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI smoke failed' }
